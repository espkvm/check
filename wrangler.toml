name = "espkvm-check"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [{ pattern = "check.espkvm.io", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "espkvm-check"
database_id = "18c2fffa-77ab-4aeb-bdf5-f237bcbbb019"

# The daily snapshot (src/index.js, snapshot), just before midnight UTC.
[triggers]
crons = ["55 23 * * *"]

# Google Analytics 4, property "ESP-KVM devices", stream check-worker. The API
# secret and INTERNAL_IDS are secrets: npx wrangler@4 secret put GA_API_SECRET
[vars]
GA_MEASUREMENT_ID = "G-FDRR5RFCQ4"
